name: Build desktop client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: aarch64
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev libdbus-1-dev libgl1-mesa-dev pkg-config rpm dpkg-dev
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.target }}'
      - name: Test protocol and firmware framing
        shell: bash
        run: cargo test --locked --target '${{ matrix.target }}'
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package-windows | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/atk-ut70-rs.exe' package-windows/
          Copy-Item LICENSE, assets/icons/LICENSE.phosphor, assets/fonts/OFL.Inter.txt package-windows/
          Compress-Archive -Path 'package-windows/*' -DestinationPath 'dist/ATK-UT70-RS-windows-${{ matrix.arch }}.zip'
      - name: Package macOS app
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p ATK-UT70-RS.app/Contents/MacOS ATK-UT70-RS.app/Contents/Resources/Licenses AppIcon.iconset dist
          cp "target/${{ matrix.target }}/release/atk-ut70-rs" ATK-UT70-RS.app/Contents/MacOS/
          cp assets/Info.plist ATK-UT70-RS.app/Contents/
          cp LICENSE assets/icons/LICENSE.phosphor assets/fonts/OFL.Inter.txt ATK-UT70-RS.app/Contents/Resources/Licenses/
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/atk-ut70-rs.png --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
          done
          cp AppIcon.iconset/icon_32x32.png AppIcon.iconset/icon_16x16@2x.png
          sips -z 64 64 assets/atk-ut70-rs.png --out AppIcon.iconset/icon_32x32@2x.png >/dev/null
          cp AppIcon.iconset/icon_256x256.png AppIcon.iconset/icon_128x128@2x.png
          cp AppIcon.iconset/icon_512x512.png AppIcon.iconset/icon_256x256@2x.png
          iconutil -c icns AppIcon.iconset -o ATK-UT70-RS.app/Contents/Resources/AppIcon.icns
          chmod +x ATK-UT70-RS.app/Contents/MacOS/atk-ut70-rs
          codesign --force --deep --sign - ATK-UT70-RS.app
          codesign --verify --deep --strict --verbose=2 ATK-UT70-RS.app
          ditto -c -k --sequesterRsrc --keepParent ATK-UT70-RS.app "dist/ATK-UT70-RS-macos-${{ matrix.arch }}.zip"
          unzip -tq "dist/ATK-UT70-RS-macos-${{ matrix.arch }}.zip"
      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/atk-ut70-rs" target/release/atk-ut70-rs
          bash scripts/build-appimage.sh
      - name: Package Linux deb and rpm
        if: matrix.platform == 'linux'
        shell: bash
        run: bash scripts/build-linux-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ATK-UT70-RS-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
